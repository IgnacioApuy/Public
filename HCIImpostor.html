<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impostor</title>
<style>
:root{
  --bg:#14161c; --surface:#1d2029; --line:#323646; --text:#e8e9ee; --muted:#9296a6;
  --accent:#e0b04a; --bad:#e5655c; --impostor:#e5655c;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.6rem;margin:8px 0 0;font-weight:600}
.hidden{display:none!important}
.grupos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 12px;font-size:1.1rem;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pantalla{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:36px 20px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.pantalla .ronda{color:var(--muted);font-size:1rem}
.pantalla .contenido{font-size:2.2rem;font-weight:700;overflow-wrap:anywhere}
.pantalla .contenido.impostor{color:var(--impostor)}
.pantalla .grupo{color:var(--muted);font-size:.9rem}
label{display:block;color:var(--muted);margin-bottom:8px}
.fila{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:1.05rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.fila button{padding:12px 18px;background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:600}
.error{color:var(--bad);min-height:1.2em;margin:8px 0 0;font-size:.95rem}
.fin{font-size:1.4rem;line-height:1.4}
.link{background:none;border:none;color:var(--muted);padding:6px;font-size:.9rem;text-decoration:underline;align-self:center}
</style>
</head>
<body>
<main>
  <section id="inicio">
    <h1>Elige tu grupo</h1>
    <div class="grupos" id="grupos" style="margin-top:20px"></div>
  </section>

  <section id="juego" class="hidden">
    <div class="pantalla" id="pantalla"></div>
    <div id="entrada" style="margin-top:20px">
      <label for="clave">Contraseña</label>
      <div class="fila">
        <input id="clave" type="password" autocomplete="off" placeholder="Para pasar a la siguiente ronda">
        <button id="enviar" type="button">Siguiente</button>
      </div>
      <p class="error" id="error" role="alert"></p>
    </div>
  </section>
</main>

<script>
/* ===== CONFIGURACIÓN ===== */

// Los 5 temas, en orden.
const TEMAS = ["Playa", "Hospital", "Circo", "Biblioteca", "Aeropuerto"];

// Las 5 contraseñas, en orden. La ronda N usa la contraseña (N-1) % 5.
const CONTRASENAS = ["luna", "roble", "faro", "nube", "cobre"];

// Orden de temas de cada grupo (índices de TEMAS, cada orden es distinto).
// La ronda N usa el tema ORDEN[grupo][(N-1) % 5].
const ORDEN = {
  1: [0, 1, 2, 3, 4],
  2: [1, 3, 4, 0, 2],
  3: [2, 4, 0, 1, 3],
  4: [4, 2, 3, 1, 0]
};

// Probabilidad de que una persona sea Impostor en cada ronda.
// Se sortea en el dispositivo de cada persona al elegir su grupo.
const PROB_IMPOSTOR = 1 / 5;

const RONDA_FINAL = 5; // al pasar de la 5 se muestra el mensaje final

/* ===== LÓGICA ===== */
let grupo = null, ronda = 1, roles = [];

const $ = id => document.getElementById(id);

// El almacenamiento solo sirve para que, si la persona recarga la página,
// conserve su grupo, su ronda y sus sorteos de impostor (no se vuelven a sortear).
function guardar(){
  try{ localStorage.setItem("impostor", JSON.stringify({grupo, ronda, roles})); }catch(e){}
}
function limpiar(){
  try{ localStorage.removeItem("impostor"); }catch(e){}
}
function cargar(){
  try{
    const s = JSON.parse(localStorage.getItem("impostor") || "null");
    if(s && ORDEN[s.grupo] && s.ronda >= 1 && Array.isArray(s.roles) && s.roles.length === RONDA_FINAL){
      grupo = s.grupo; ronda = s.ronda; roles = s.roles; return true;
    }
  }catch(e){}
  return false;
}

function pintar(){
  $("inicio").classList.add("hidden");
  $("juego").classList.remove("hidden");
  const p = $("pantalla");
  $("error").textContent = "";
  $("clave").value = "";

  if(ronda > RONDA_FINAL){
    p.innerHTML = '<div class="contenido fin">Ya no hay más rondas, gana el menor del grupo que quedó.</div>';
    $("entrada").classList.add("hidden");
    limpiar(); // fin de la partida: al recargar se vuelve a la selección de grupo
    return;
  }
  $("entrada").classList.remove("hidden");
  const esImpostor = roles[ronda - 1];
  const tema = TEMAS[ORDEN[grupo][(ronda - 1) % TEMAS.length]];
  p.innerHTML =
    '<div class="ronda">Ronda ' + ronda + '</div>' +
    '<div class="contenido' + (esImpostor ? ' impostor' : '') + '"></div>' +
    '<div class="grupo">Grupo ' + grupo + '</div>';
  p.querySelector(".contenido").textContent = esImpostor ? "Impostor" : tema;
  $("clave").focus();
}

function elegir(g){
  grupo = g; ronda = 1;
  roles = Array.from({length: RONDA_FINAL}, () => Math.random() < PROB_IMPOSTOR);
  guardar(); pintar();
}

function enviar(){
  const esperada = CONTRASENAS[(ronda - 1) % CONTRASENAS.length];
  if($("clave").value.trim().toLowerCase() === esperada.toLowerCase()){
    ronda++; guardar(); pintar();
  }else{
    $("error").textContent = "Contraseña incorrecta.";
  }
}

Object.keys(ORDEN).forEach(g => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = "Grupo " + g;
  b.addEventListener("click", () => elegir(Number(g)));
  $("grupos").appendChild(b);
});
$("enviar").addEventListener("click", enviar);
$("clave").addEventListener("keydown", e => { if(e.key === "Enter") enviar(); });
if(cargar()) pintar();
</script>
</body>
</html>
